name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      JWT_SECRET: ci-only-secret-not-used-anywhere
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml has been regenerated and committed.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @timeflow/api build
      - run: pnpm --filter @timeflow/web build

  # Boots the real API against a throw-away Postgres and runs the security/regression smoke test
  # (tenant + role isolation, PHI encryption, locking, audit trail, patient confinement, ...).
  api-smoke:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/timeflow
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-1234
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
      SMOKE_REGISTER: '1'
      AUTH_RATE_LIMIT_MAX: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @timeflow/api exec prisma migrate deploy
      - name: Migrations must match schema.prisma (fails if someone edited the schema without a migration)
        run: >
          pnpm --filter @timeflow/api exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: pnpm --filter @timeflow/api build
      - name: Generate a throw-away PHI encryption key
        run: echo "PHI_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start API
        run: |
          nohup pnpm --filter @timeflow/api start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat api.log; exit 1
      - name: Smoke test
        run: pnpm --filter @timeflow/api exec node scripts/smoke-healthcare.js
      - name: Tenant isolation test (organization B must never reach organization A's data)
        run: pnpm --filter @timeflow/api exec node scripts/smoke-tenant-isolation.js
      - name: Multi-factor authentication test
        run: pnpm --filter @timeflow/api exec node scripts/smoke-mfa.js
      - name: Billing sheet capture test (every time-entry change is logged and the sheet follows it)
        run: pnpm --filter @timeflow/api exec node scripts/smoke-billing-sheet.js
      - name: Google Sheets client test (against a local fake Google)
        run: pnpm --filter @timeflow/api exec node scripts/smoke-google-provider.js
      - name: Live sheet sync engine test
        run: pnpm --filter @timeflow/api exec node scripts/smoke-billing-sheet-sync.js
      - name: API log (on failure)
        if: failure()
        run: tail -n 150 api.log || true
